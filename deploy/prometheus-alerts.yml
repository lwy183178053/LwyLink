groups:
  - name: lwylink-control
    rules:
      - alert: LwyLinkTURNChargeFailures
        expr: increase(lwylink_turn_charge_failures_total[10m]) > 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: TURN traffic charge failures detected
          description: TURN usage accounting failed at least once in the last 10 minutes.

      - alert: LwyLinkCoturnUsageLogStale
        expr: lwylink_coturn_usage_collector_enabled == 1 and (lwylink_coturn_usage_log_available == 0 or lwylink_coturn_log_lag_seconds > 600)
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: coturn usage log is stale
          description: coturn usage collection is enabled, but the log is missing or has not changed for more than 10 minutes.

      - alert: LwyLinkRelayTrafficSpike
        expr: increase(lwylink_relay_traffic_used_bytes[15m]) > 1073741824 or increase(lwylink_turn_traffic_used_bytes[15m]) > 1073741824
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Relay traffic increased quickly
          description: Relay or TURN traffic increased by more than 1 GiB in 15 minutes.

      - alert: LwyLinkNodeDown
        expr: lwylink_nodes_down > 0
        for: 3m
        labels:
          severity: critical
        annotations:
          summary: LwyLink server node is down
          description: At least one enabled server node is not online.

      - alert: LwyLinkNoOnlineRoomsWithOpenRooms
        expr: lwylink_rooms_open > 0 and lwylink_rooms_online == 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: No online rooms while rooms are open
          description: Open rooms exist, but no room has an online overlay member.
